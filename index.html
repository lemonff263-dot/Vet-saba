    function App() {
      // Navigation Tabs
      const [currentTab, setCurrentTab] = useState("dashboard"); // dashboard, pos, inventory, dues, reports, settings
      
      // Role-Based State (Owner, Manager, Sales Staff)
      const [currentRole, setCurrentRole] = useState("owner"); // "owner", "manager", "staff"
      const [showRoleModal, setShowRoleModal] = useState(false);
      const [showPermissionDeniedModal, setShowPermissionDeniedModal] = useState(false);
      const [deniedActionText, setDeniedActionText] = useState("");

      // App Data State
      const [medicines, setMedicines] = useState(INITIAL_MEDICINES);
      const [customers, setCustomers] = useState(INITIAL_CUSTOMERS);
      const [sales, setSales] = useState(INITIAL_SALES);
      const [isOnline, setIsOnline] = useState(true);

      // POS Cart State
      const [cart, setCart] = useState([
        { medicine: INITIAL_MEDICINES[0], qty: 1, batch: "BAT-2024-09", rate: 450 },

      const [posPaymentType, setPosPaymentType] = useState("cash"); // cash, bkash, due, partial
      const [posPaidAmount, setPosPaidAmount] = useState(1030);
      const [showSuccessModal, setShowSuccessModal] = useState(false);
      const [lastInvoice, setLastInvoice] = useState(null);

      // Inventory Filtering
      const [inventoryCategory, setInventoryCategory] = useState("সব");
      const [inventorySearch, setInventorySearch] = useState("");
      const [showAddMedicineModal, setShowAddMedicineModal] = useState(false);

      // New Medicine Form State
      const [newMedForm, setNewMedForm] = useState({
        name: "",
        nameBn: "",
        generic: "",
        company: "Renata Animal Health",
        category: "অ্যান্টিবায়োটিক",
        price: "",

        stock: "",

      });

      const [showDueModal, setShowDueModal] = useState(false);
      const [dueTargetCustomer, setDueTargetCustomer] = useState(null);
      const [dueCollectionAmount, setDueCollectionAmount] = useState("");

      // Helper to guard actions based on role
      const checkPermission = (actionName, requiredMinRole = "manager") => {
        if (currentRole === "owner") return true;
        if (currentRole === "manager" && requiredMinRole !== "owner") return true;
        
        // Denied
        setDeniedActionText(actionName);
        setShowPermissionDeniedModal(true);
        return false;
      };

      // Cart Calculations
      const subtotal = useMemo(() => {
        return cart.reduce((acc, item) => acc + item.rate * item.qty, 0);
      }, [cart]);

      const grandTotal = useMemo(() => {
        const val = subtotal - (Number(posDiscount) || 0);
        return val > 0 ? val : 0;
      }, [subtotal, posDiscount]);

      const cartDueAmount = useMemo(() => {
        if (posPaymentType === "due") return grandTotal;
        if (posPaymentType === "cash" || posPaymentType === "bkash") return 0;
        const paid = Number(posPaidAmount) || 0;
        return grandTotal > paid ? grandTotal - paid : 0;
      }, [grandTotal, posPaymentType, posPaidAmount]);

      // Complete Sale Action
      const handleCompleteSale = () => {
        if (cart.length === 0) {
          alert("কার্টে কোনো ওষুধ নেই!");
          return;
        }

        const invId = `INV-2024-${Math.floor(100 + Math.random() * 900)}`;
        const newSaleRecord = {
          id: invId,
          customerName: selectedCustomer ? selectedCustomer.name : "সাধারণ গ্রাহক",
          itemsSummary: cart.map(i => i.medicine.name).join(", "),
          itemCount: cart.reduce((acc, i) => acc + i.qty, 0),
          total: grandTotal,
          paid: posPaymentType === "due" ? 0 : (posPaymentType === "partial" ? Number(posPaidAmount) : grandTotal),
          due: cartDueAmount,
          status: cartDueAmount === 0 ? "পরিশোধিত" : (posPaymentType === "due" ? "বাকি" : "আংশিক বাকি"),

        setMedicines(prev => prev.map(m => {
          const inCart = cart.find(ci => ci.medicine.id === m.id);
          if (inCart) {
            const newStock = Math.max(0, m.stock - inCart.qty);
            return { ...m, stock: newStock, isLowStock: newStock <= 5 };
          }
          return m;
        }));

        // Update customer due if applicable
        if (selectedCustomer && cartDueAmount > 0) {
          setCustomers(prev => prev.map(c => {
            if (c.id === selectedCustomer.id) {
              return { ...c, totalDue: c.totalDue + cartDueAmount };
            }
            return c;
          }));
        }

        setSales([newSaleRecord, ...sales]);
        setLastInvoice(newSaleRecord);
        setShowSuccessModal(true);
        setCart([]);

          name: newMedForm.name,
          nameBn: newMedForm.nameBn || newMedForm.name,

          category: newMedForm.category,
          price: Number(newMedForm.price),
          buyPrice: Number(newMedForm.buyPrice) || Math.round(Number(newMedForm.price) * 0.8),

          batchNo: newMedForm.batchNo || "BAT-2024",

          isLowStock: (Number(newMedForm.stock) || 10) <= 5,

        setCustomers(prev => prev.map(c => {

                  Vet সেবা v1.0.4 • ভেটেরিনারি ফার্মেসি ইকোসিস্টেম
                </div>
              </div>
            )}

          </main>

          {/* =========================================================
              PERSISTENT BOTTOM NAVIGATION (5 Icons + Floating POS)
             ========================================================= */}
          <nav className="fixed bottom-0 inset-x-0 z-40 pb-safe bg-white/95 backdrop-blur-xl border-t border-[#e2e8f0]">
            <div className="flex items-center justify-between h-16 px-1 max-w-xl mx-auto w-full">
              
              {/* 1. ড্যাশবোর্ড */}
              <button 
                onClick={() => setCurrentTab("dashboard")}
                className={`flex flex-col items-center justify-center flex-1 h-full transition-colors ${
                  currentTab === "dashboard" ? "text-[#005d42]" : "text-slate-500 hover:text-slate-800"
                }`}
              >
                <span className="material-symbols-outlined text-[22px]">grid_view</span>
                <span className="text-[11px] mt-0.5 leading-none">ড্যাশবোর্ড</span>
              </button>

              {/* 2. ইনভেন্টরি */}
              <button 
                onClick={() => setCurrentTab("inventory")}
                className={`flex flex-col items-center justify-center flex-1 h-full transition-colors ${
                  currentTab === "inventory" ? "text-[#005d42]" : "text-slate-500 hover:text-slate-800"
                }`}
              >
                <span className="material-symbols-outlined text-[22px]">inventory_2</span>
                <span className="text-[11px] mt-0.5 leading-none">ইনভেন্টরি</span>
              </button>

              {/* 3. বিক্রয় (POS) Center Floating CTA */}
              <div className="flex flex-col items-center justify-center px-1 -mt-5">
                <button 
                  onClick={() => setCurrentTab("pos")}
                  aria-label="বিক্রয় POS" 
                  className="flex items-center justify-center w-12 h-12 rounded-full bg-[#005d42] hover:bg-[#047857] text-white shadow-lg active:scale-95 transition-all"
                >
                  <span className="material-symbols-outlined text-2xl">point_of_sale</span>
                </button>
                <span className="text-[10px] mt-1 leading-none text-slate-800">বিক্রয় POS</span>
              </div>

              {/* 4. বাকি / খামারি */}
              <button 
                onClick={() => setCurrentTab("dues")}
                className={`flex flex-col items-center justify-center flex-1 h-full transition-colors ${
                  currentTab === "dues" ? "text-[#005d42]" : "text-slate-500 hover:text-slate-800"
                }`}
              >
                <span className="material-symbols-outlined text-[22px]">account_balance_wallet</span>
                <span className="text-[11px] mt-0.5 leading-none">বাকি খাতা</span>
              </button>

              {/* 5. রিপোর্ট */}
              <button 
                onClick={() => setCurrentTab("reports")}
                className={`flex flex-col items-center justify-center flex-1 h-full transition-colors ${
                  currentTab === "reports" ? "text-[#005d42]" : "text-slate-500 hover:text-slate-800"
                }`}
              >
                <span className="material-symbols-outlined text-[22px]">analytics</span>
                <span className="text-[11px] mt-0.5 leading-none">রিপোর্ট</span>
              </button>

            </div>
          </nav>

          {/* =========================================================
              MODAL: ROLE SWITCHER (Owner / Manager / Staff)
             ========================================================= */}
          {showRoleModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl flex flex-col gap-4">
                <div className="flex items-center justify-between border-b pb-2">
                  <h3 className="text-sm text-slate-900 flex items-center gap-1.5">
                    <span className="material-symbols-outlined text-[#005d42]">shield_person</span>
                    <span>ব্যবহারকারীর রোল পরিবর্তন</span>
                  </h3>
                  <button onClick={() => setShowRoleModal(false)} className="text-slate-400 hover:text-slate-700">
                    <span className="material-symbols-outlined">close</span>
                  </button>
                </div>

                <div className="flex flex-col gap-2">
                  {[
                    { id: "owner", title: "মালিক (Owner)", desc: "সকল পারমিশন, কেনা দাম, নিট লাভ ও সেটিংস উন্মুক্ত" },
                    { id: "manager", title: "ম্যানেজার (Manager)", desc: "স্টক এন্ট্রি, বাকি খাতা ও বিলিং অনুমোদনযোগ্য" },
                    { id: "staff", title: "সেলস কর্মী (Sales Staff)", desc: "শুধু বিক্রি ও রসিদ প্রিন্ট; কেনা দাম ও লাভ লুকানো" }
                  ].map(r => (
                    <button
                      key={r.id}
                      onClick={() => {
                        setCurrentRole(r.id);
                        setShowRoleModal(false);
                      }}
                      className={`p-3 rounded-xl border text-left flex items-start justify-between transition-all ${
                        currentRole === r.id 
                          ? "bg-emerald-50 border-[#005d42] text-[#005d42]" 
                          : "border-slate-200 hover:bg-slate-50"
                      }`}
                    >
                      <div>
                        <div className="text-xs">{r.title}</div>
                        <span className="text-[11px] text-slate-500 font-normal">{r.desc}</span>
                      </div>
                      {currentRole === r.id && (
                        <span className="material-symbols-outlined text-[#005d42] text-sm">check_circle</span>
                      )}
                    </button>
                  ))}
                </div>

                <button 
                  onClick={() => setShowRoleModal(false)}
                  className="w-full py-2 bg-slate-100 text-slate-700 rounded-xl text-xs hover:bg-slate-200"
                >
                  বন্ধ করুন
                </button>
              </div>
            </div>
          )}

          {/* =========================================================
              MODAL: PERMISSION DENIED (vet_no_permission_dialogs)
             ========================================================= */}
          {showPermissionDeniedModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl flex flex-col items-center text-center gap-3">
                <div className="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center text-2xl">
                  <span className="material-symbols-outlined">lock</span>
                </div>
                <h3 className="text-sm text-slate-900">এই সেকশনে প্রবেশের অনুমতি নেই</h3>
                <p className="text-xs text-slate-600 leading-snug">
                  "{deniedActionText}" অ্যাকশনটি শুধুমাত্র দোকান মালিক বা ম্যানেজারের অনুমোদিত। এগিয়ে যেতে মালিকের পিন প্রবেশ করান।
                </p>
                <div className="w-full flex gap-2 mt-2">
                  <button 
                    onClick={() => setShowPermissionDeniedModal(false)}
                    className="flex-1 py-2 bg-slate-100 text-slate-700 rounded-xl text-xs"
                  >
                    বাতিল
                  </button>
                  <button 
                    onClick={() => {
                      setCurrentRole("owner");
                      setShowPermissionDeniedModal(false);
                      alert("মালিকের অনুমতি গৃহীত হয়েছে!");
                    }}
                    className="flex-1 py-2 bg-[#005d42] text-white rounded-xl text-xs"
                  >
                    মালিক হিসেবে আনলক
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* =========================================================
              MODAL: ADD NEW MEDICINE (vet_add_medicine)
             ========================================================= */}
          {showAddMedicineModal && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/50 p-0 sm:p-4">
              <div className="bg-white rounded-t-2xl sm:rounded-2xl max-w-md w-full p-5 shadow-2xl max-h-[90vh] overflow-y-auto flex flex-col gap-3">
                <div className="flex items-center justify-between border-b pb-2">
                  <h3 className="text-sm text-slate-900 flex items-center gap-1.5">
                    <span className="material-symbols-outlined text-[#005d42]">medication</span>
                    <span>নতুন ওষুধ যুক্ত করুন</span>
                  </h3>
                  <button onClick={() => setShowAddMedicineModal(false)} className="text-slate-400">
                    <span className="material-symbols-outlined">close</span>
                  </button>
                </div>

                <form onSubmit={handleAddMedicineSubmit} className="flex flex-col gap-3 text-xs">
                  <div>
                    <label className="text-slate-700 block mb-1">ওষুধের বাণিজ্যিক নাম (English) *</label>
                    <input 
                      type="text" 
                      required
                      placeholder="e.g. Renamycin 100ml"
                      value={newMedForm.name}
                      onChange={(e) => setNewMedForm({...newMedForm, name: e.target.value})}
                      className="w-full text-xs rounded-lg border-slate-300 py-1.5 focus:ring-[#005d42]"
                    />
                  </div>

                  <div>
                    <label className="text-slate-700 block mb-1">বাংলা নাম</label>
                    <input 
                      type="text" 
                      placeholder="e.g. রেনামাইসিন ১০০ মি.লি."
                      value={newMedForm.nameBn}
                      onChange={(e) => setNewMedForm({...newMedForm, nameBn: e.target.value})}
                      className="w-full text-xs rounded-lg border-slate-300 py-1.5 focus:ring-[#005d42]"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-slate-700 block mb-1">ক্যাটাগরি</label>
                      <select 
                        value={newMedForm.category}
                        onChange={(e) => setNewMedForm({...newMedForm, category: e.target.value})}
                        className="w-full text-xs rounded-lg border-slate-300 py-1.5 focus:ring-[#005d42]"
                      >
                        <option value="অ্যান্টিবায়োটিক">অ্যান্টিবায়োটিক</option>
                        <option value="ভিটামিন ও মিনারেল">ভিটামিন ও মিনারেল</option>
                        <option value="কৃমিনাশক">কৃমিনাশক</option>
                        <option value="ব্যথানাশক ও জ্বর">ব্যথানাশক ও জ্বর</option>
                        <option value="ক্যালসিয়াম ও সাপ্লিমেন্ট">ক্যালসিয়াম</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-slate-700 block mb-1">কোম্পানি</label>
                      <select 
                        value={newMedForm.company}
                        onChange={(e) => setNewMedForm({...newMedForm, company: e.target.value})}
                        className="w-full text-xs rounded-lg border-slate-300 py-1.5 focus:ring-[#005d42]"
                      >
                        <option value="Renata Animal Health">Renata Animal Health</option>
                        <option value="Square AgroVet">Square AgroVet</option>
                        <option value="ACI Animal Health">ACI Animal Health</option>
                        <option value="Opsonin Pharma">Opsonin Pharma</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-slate-700 block mb-1">বিক্রয় মূল্য (MRP ৳) *</label>
                      <input 
                        type="number" 
                        required
                        placeholder="450"
                        value={newMedForm.price}
                        onChange={(e) => setNewMedForm({...newMedForm, price: e.target.value})}
                        className="w-full text-xs rounded-lg border-slate-300 py-1.5 focus:ring-[#005d42] num"
                      />
                    </div>
                    <div>
                      <label className="text-slate-700 block mb-1">পাইকারি কেনা দাম (৳)</label>
                      <input 
                        type="number" 
                        placeholder="380"
                        value={newMedForm.buyPrice}
                        onChange={(e) => setNewMedForm({...newMedForm, buyPrice: e.target.value})}
                        className="w-full text-xs rounded-lg border-slate-300 py-1.5 focus:ring-[#005d42] num"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="text-slate-700 block mb-1">প্রাথমিক স্টক</label>
                      <input 
                        type="number" 
                        placeholder="20"
                        value={newMedForm.stock}
                        onChange={(e) => setNewMedForm({...newMedForm, stock: e.target.value})}
                        className="w-full text-xs rounded-lg border-slate-300 py-1.5 focus:ring-[#005d42] num"
                      />
                    </div>
                    <div>
                      <label className="text-slate-700 block mb-1">ব্যাচ নম্বর</label>
                      <input 
                        type="text" 
                        value={newMedForm.batchNo}
                        onChange={(e) => setNewMedForm({...newMedForm, batchNo: e.target.value})}
                        className="w-full text-xs rounded-lg border-slate-300 py-1.5 focus:ring-[#005d42] num"
                      />
                    </div>
                    <div>
                      <label className="text-slate-700 block mb-1">মেয়াদ (MM/YY)</label>
                      <input 
                        type="text" 
                        value={newMedForm.expiryDate}
                        onChange={(e) => setNewMedForm({...newMedForm, expiryDate: e.target.value})}
                        className="w-full text-xs rounded-lg border-slate-300 py-1.5 focus:ring-[#005d42] num"
                      />
                    </div>
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button 
                      type="button" 
                      onClick={() => setShowAddMedicineModal(false)}
                      className="flex-1 py-2 bg-slate-100 text-slate-700 rounded-xl"
                    >
                      বাতিল
                    </button>
                    <button 
                      type="submit" 
                      className="flex-1 py-2 bg-[#005d42] text-white rounded-xl shadow-xs"
                    >
                      ওষুধ সংরক্ষণ করুন
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* =========================================================
              MODAL: COLLECT DUE (বাকির খাতা জমা)
             ========================================================= */}
          {showDueModal && dueTargetCustomer && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl flex flex-col gap-3 text-xs">
                <div className="flex items-center justify-between border-b pb-2">
                  <h3 className="text-sm text-slate-900">বকেয়া টাকা জমা গ্রহণ</h3>
                  <button onClick={() => setShowDueModal(false)} className="text-slate-400">
                    <span className="material-symbols-outlined">close</span>
                  </button>
                </div>

                <div className="bg-slate-50 p-3 rounded-xl border">
                  <div>খামারি: <b>{dueTargetCustomer.name}</b></div>
                  <div className="text-slate-500 mt-0.5">{dueTargetCustomer.farmType} • {dueTargetCustomer.village}</div>
                  <div className="text-red-600 mt-1">বর্তমান বকেয়া: <b>৳{dueTargetCustomer.totalDue}</b></div>
                </div>

                <div>
                  <label className="text-slate-700 block mb-1">জমার পরিমাণ (৳):</label>
                  <input 
                    type="number"
                    value={dueCollectionAmount}
                    onChange={(e) => setDueCollectionAmount(e.target.value)}
                    className="w-full text-sm rounded-lg border-slate-300 py-2 num"
                  />
                </div>

                <div className="flex gap-1.5">
                  {[500, 1000, 2000].map(amt => (
                    <button 
                      key={amt}
                      type="button"
                      onClick={() => setDueCollectionAmount(amt)}
                      className="px-2.5 py-1 bg-slate-100 rounded-lg text-slate-700 border text-xs"
                    >
                      +৳{amt}
                    </button>
                  ))}
                  <button 
                    type="button"
                    onClick={() => setDueCollectionAmount(dueTargetCustomer.totalDue)}
                    className="px-2.5 py-1 bg-emerald-50 text-[#005d42] rounded-lg border border-emerald-200 text-xs"
                  >
                    পূর্ণ পরিশোধ
                  </button>
                </div>

                <div className="flex gap-2 pt-2">
                  <button 
                    onClick={() => setShowDueModal(false)}
                    className="flex-1 py-2 bg-slate-100 text-slate-700 rounded-xl"
                  >
                    বাতিল
                  </button>
                  <button 
                    onClick={handleCollectDue}
                    className="flex-1 py-2 bg-[#005d42] text-white rounded-xl shadow-xs"
                  >
                    জমা নিশ্চিত করুন
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* =========================================================
              MODAL: SUCCESS INVOICE RECEIPT (vet_invoice_receipt)
             ========================================================= */}
          {showSuccessModal && lastInvoice && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl flex flex-col gap-3 text-xs">
                <div className="text-center py-2">
                  <div className="w-12 h-12 bg-emerald-100 text-[#005d42] rounded-full flex items-center justify-center mx-auto mb-2 text-2xl">
                    <span className="material-symbols-outlined">check_circle</span>
                  </div>
                  <h3 className="text-sm text-slate-900">বিক্রয় সফলভাবে সম্পন্ন হয়েছে!</h3>
                  <span className="text-slate-500 text-[11px]">মেমো নং: #{lastInvoice.id}</span>
                </div>

                <div className="bg-slate-50 p-3 rounded-xl border border-dashed border-slate-300 text-xs flex flex-col gap-1.5">
                  <div className="flex justify-between">
                    <span className="text-slate-500">গ্রাহক / খামারি:</span>
                    <span className="text-slate-900">{lastInvoice.customerName}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-500">মোট আইটেম:</span>
                    <span className="num">{lastInvoice.itemCount} টি</span>
                  </div>
                  <div className="flex justify-between border-t border-slate-200 pt-1.5 font-bold text-slate-900">
                    <span>মোট বিল:</span>
                    <span className="num">৳{lastInvoice.total}</span>
                  </div>
                  <div className="flex justify-between text-emerald-700">
                    <span>পরিশোধিত:</span>
                    <span className="num">৳{lastInvoice.paid}</span>
                  </div>
                  {lastInvoice.due > 0 && (
                    <div className="flex justify-between text-red-600 font-bold">
                      <span>বাকি পাওনা:</span>
                      <span className="num">৳{lastInvoice.due}</span>
                    </div>
                  )}
                </div>

                <div className="flex flex-col gap-2 pt-1">
                  <button 
                    onClick={() => alert(`ইনভয়েস #${lastInvoice.id} থার্মাল প্রিন্টারে পাঠানো হয়েছে!`)}
                    className="w-full py-2.5 bg-[#005d42] text-white rounded-xl flex items-center justify-center gap-1.5 shadow-xs"
                  >
                    <span className="material-symbols-outlined text-sm">print</span>
                    <span>রসিদ প্রিন্ট করুন</span>
                  </button>

                  <button 
                    onClick={() => alert("হোয়াটসঅ্যাপে ক্যাশ মেমো পাঠানো হয়েছে!")}
                    className="w-full py-2.5 bg-emerald-50 text-emerald-800 border border-emerald-300 rounded-xl flex items-center justify-center gap-1.5"
                  >
                    <span className="material-symbols-outlined text-sm">chat</span>
                    <span>হোয়াটসঅ্যাপে মেমো পাঠান</span>
                  </button>

                  <button 
                    onClick={() => setShowSuccessModal(false)}
                    className="w-full py-2 bg-slate-100 text-slate-700 rounded-xl hover:bg-slate-200"
                  >
                    নতুন বিক্রি শুরু করুন
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
